        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsumerGetPartitionsRequest'}
      responses:
        '200':
          description: Partition numbers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerPartitionsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /consumer/list-partitions:
    post:
      tags: [consumer]
      summary: Get the partitions of a topic
      deprecated: true
      description: Deprecated — use `/consumer/get-partitions` instead.
      operationId: consumerListPartitions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsumerGetPartitionsRequest'}
      responses:
        '200':
          description: Topic and its partition numbers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerListPartitionsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /consumer/list-topics:
    post:
      tags: [consumer]
      summary: List topics visible to the consumer
      operationId: consumerListTopics
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsumerListTopicsRequest'}
