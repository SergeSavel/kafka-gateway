        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/subscribe:
    post:
      tags: [consumer]
      summary: Subscribe to topics by list or regex pattern
      description: |
        Provide `topics` or `pattern`; when both are provided, `topics` is used.
        `400` when neither is provided.
      operationId: consumerSubscribe
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsumerSubscribeRequest'}
      responses:
        '204': {description: Subscribed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/unsubscribe:
    post:
      tags: [consumer]
      summary: Unsubscribe from all topics and partitions
      operationId: consumerUnsubscribe
      requestBody: {$ref: '#/components/requestBodies/ConsumerInstanceRef'}
      responses:
        '204': {description: Unsubscribed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-subscription:
    post:
      tags: [consumer]
      summary: Get the topics the consumer is subscribed to
      operationId: consumerGetSubscription
      requestBody: {$ref: '#/components/requestBodies/ConsumerInstanceRef'}
