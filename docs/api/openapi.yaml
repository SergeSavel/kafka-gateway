        '200':
          description: Topic names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerSubscriptionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-partitions:
    post:
      tags: [consumer]
      summary: Get the partitions of a topic
      operationId: consumerGetPartitions
