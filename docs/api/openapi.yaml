        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-assignment:
    post:
      tags: [consumer]
      summary: Get the partitions currently assigned to the consumer
      operationId: consumerGetAssignment
      requestBody: {$ref: '#/components/requestBodies/ConsumerInstanceRef'}
      responses:
